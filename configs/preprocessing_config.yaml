# Preprocessing configuration tuned for CASIA-Iris-Thousand (640x480 NIR grayscale)

specular:
  threshold: 235
  dilate_radius: 3
  inpaint_radius: 4

pupil:
  min_radius: 18
  max_radius: 75
  border_margin: 40
  min_circularity: 0.50
  min_solidity: 0.70
  refine_xy_range: 6
  refine_r_range: 6

iris:
  min_radius: 65
  max_radius: 155
  min_iris_pupil_ratio: 1.5
  max_iris_pupil_ratio: 4.8
  center_offset_max: 14
  coarse_step: 3
  fine_step: 1
  lateral_arc_deg: 35

normalization:
  radial_res: 64
  angular_res: 256
  apply_clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]

roi:
  margin_scale: 1.15
  output_size: 224
  jpeg_quality: 95

quality:
  min_valid_pixel_ratio: 0.35
